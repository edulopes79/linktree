<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linktree</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="min-h-screen flex items-center justify-center px-6 py-10">

        <div class="w-full max-w-md text-center">

            <div class="flex justify-center mb-5">
                <div class="avatar">
                    <i data-lucide="sparkles" class="w-10 h-10 text-white"></i>
                </div>
            </div>

            <h1 class="text-3xl font-bold">
                Meu Espaço
            </h1>

            <p class="text-gray-500 mt-2 mb-8">
                Encontre tudo em um só lugar.
            </p>

            <div class="space-y-4">

                <a href="#" class="link-card">

                    <div class="flex items-center gap-4">
                        <div class="icon-box">
                            <i data-lucide="globe"></i>
                        </div>

                        <span>Site principal</span>
                    </div>

                    <i data-lucide="arrow-up-right" class="arrow"></i>

                </a>


                <a href="#" class="link-card">

                    <div class="flex items-center gap-4">
                        <div class="icon-box">
                            <i data-lucide="image"></i>
                        </div>

                        <span>Galeria</span>
                    </div>

                    <i data-lucide="arrow-up-right" class="arrow"></i>

                </a>


                <a href="#" class="link-card">

                    <div class="flex items-center gap-4">
                        <div class="icon-box">
                            <i data-lucide="folder"></i>
                        </div>

                        <span>Projetos</span>
                    </div>

                    <i data-lucide="arrow-up-right" class="arrow"></i>

                </a>


                <a href="#" class="link-card">

                    <div class="flex items-center gap-4">
                        <div class="icon-box">
                            <i data-lucide="message-circle"></i>
                        </div>

                        <span>Contato</span>
                    </div>

                    <i data-lucide="arrow-up-right" class="arrow"></i>

                </a>

            </div>

            <div class="flex justify-center gap-5 mt-8">

                <a href="#" class="social-button">
                    <i data-lucide="instagram"></i>
                </a>

                <a href="#" class="social-button">
                    <i data-lucide="twitter"></i>
                </a>

                <a href="#" class="social-button">
                    <i data-lucide="youtube"></i>
                </a>

            </div>


            <p class="text-sm text-gray-400 mt-10">
                © 2026 • Todos os direitos reservados
            </p>

        </div>

    </main>


    <script>
        lucide.createIcons();
    </script>

</body>

</html>
